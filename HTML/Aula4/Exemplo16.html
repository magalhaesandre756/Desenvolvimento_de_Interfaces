<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 16 - HTML</title>
</head>
<body>
    <form action="formulario.aspx" method="get">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <div>
                <label for="">Nome</label><br>
                <input type="text" name="txtNome" id="txtNome">
            </div>
            <br>
            <div>
                <label for="">Endereço</label><br>
                <input type="text" name="txtEndereco" id="txtEndereco">
            </div>
            <br>
            <div>
                <label for="">Cidade</label><br>
                <input type="text" name="txtCidade" id="txtCidade">
            </div>
            <br>
            <div>
                <label for="">Estado</label><br>
                <select name="cboEstado" id="cboEstado">
                    <option value="1">São Paulo</option>
                    <option value="2">Minas Gerais</option>
                    <option value="3">Paraná</option>
                    <option value="4">Bahia</option>
                    <option value="5">Goiás</option>
                    <option value="6">Rio Grande do sul </option>
                    <option value="7">Mato Grosso</option>
                    <option value="8">Amazonas</option>
                    <option value="9">Santa Catarina</option>
                    <option value="10">Espírito Santo</option>
                </select>
            </div>
        </fieldset>
        <fieldset>
            <legend>Dados Profissionais</legend>
            <div>
                <label for="">Natureza do Cargo</label><br>
                <input type="radio" name="rdNaturezaCargo" id="rdNaturezaCargo"> Gerência
                <input type="radio" name="rdNaturezaCargo" id="rdNaturezaCargo"> Financeiro
                <input type="radio" name="rdNaturezaCargo" id="rdNaturezaCargo"> Recepção
                <input type="radio" name="rdNaturezaCargo" id="rdNaturezaCargo"> Administrativo
                <input type="radio" name="rdNaturezaCargo" id="rdNaturezaCargo"> Juridico
            </div>

            <br>
            <div>
                <label for="">Área de interesse</label><br>
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse">Computação
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse">Biologia
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse">Meio Ambiente
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse">Engenharia
                <input type="checkbox" name="chkAreaInteresse" id="chkAreaInteresse">História
            </div>
            <br>

            <div>
                <label for="">Mini-Curriculo</label><br>
                <textarea name="textarea" id="textarea" cols="50" rows="20"></textarea>
            </div>
            <br>
            <button type="submit">Enviar</button>
            <button type="submit">Limpar</button>
        </fieldset>
    </form>
</body>
</html>
