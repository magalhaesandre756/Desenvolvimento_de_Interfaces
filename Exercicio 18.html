<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 18 - HTML</title>
</head>
<body>
    <form action="exercicio18.aspx" method="get">
        <fieldset>
            <legend>Dados</legend>
            <div>
                <label for="">Nome Completo</label><br>
                <input type="text" name="txtNomeCompleto" id="txtNomeCompleto" required placeholder="Digite seu Nome Completo">
            </div>
            <br>
            <div>
                <label for="">Cor Favorita</label><br>
                <input type="color" name="" id="">
            </div>
            <br>
        </fieldset>
        <fieldset>
            <legend>Faculdade</legend>
            <div>
                <label for="">Disciplinas de interesse</label><br>
                <input type="checkbox" name="chkDisciplinaInteresse" id="chkDisciplinaInteresse">Engenharia de Requisitos
                <input type="checkbox" name="chkDisciplinaInteresse" id="chkDisciplinaInteresse">Desenvolvimento de Interfaces
                <input type="checkbox" name="chkDisciplinaInteresse" id="chkDisciplinaInteresse">Programação orientada a objetos
                <input type="checkbox" name="chkDisciplinaInteresse" id="chkDisciplinaInteresse">Banco de Dados
                <input type="checkbox" name="chkDisciplinaInteresse" id="chkDisciplinaInteresse">Algebra linear
            </div>
            <br>
            <div>
                <label for="">Turno preferido</label><br>
            <input type="radio" name="txtturno" id="txtturno">Vespertino
            <input type="radio" name="txtturno" id="txtturno">Matutino
            <input type="radio" name="txtturno" id="txtturno">Noturno
            </div>
            <br>
            <div>
                <label for="">Curso Favorito</label><br>
                <select name="cboCurso" id="cboCurso">
                    <option value="1">Engenharia de Software</option>
                    <option value="2">Engenharia da Computação</option>
                    <option value="3">Ciência da Computação</option>
                </select>
            </div>
        </fieldset>
        <Fieldset>
            <legend>Nível de interesse HTML</legend>
            <div>
                <label for="">HTML</label>
                <input type="range" name="rngHtml" id="rngHtml" min="0" max="10" step="1" value="5">
            </div>
            <br>
        </Fieldset>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
